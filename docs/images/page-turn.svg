<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Two charts of hinge angle over time. Left: a quick dip of 32 degrees that returns within 0.3 seconds is reported as a page turn. Right: a slow fold over 2 seconds is not; the resting angle follows it." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  text { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #57606a; }
  .title { font-size: 14px; font-weight: 600; fill: #1f2328; }
  .strong { font-weight: 600; fill: #0969da; }
  .axis { stroke: #d0d7de; stroke-width: 1; }
  .angle { fill: none; stroke: #0969da; stroke-width: 2.5; stroke-linejoin: round; }
  .rest { fill: none; stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 6 5; }
  .depth { fill: none; stroke: #bc4c00; stroke-width: 1.5; stroke-dasharray: 2 4; }
  .bracket { stroke: #57606a; stroke-width: 1; }
  .hit { fill: #0969da; }
  @media (prefers-color-scheme: dark) {
    text { fill: #9198a1; }
    .title { fill: #e6edf3; }
    .strong, .hit { fill: #4493f8; }
    .axis { stroke: #3d444d; }
    .angle { stroke: #4493f8; }
    .rest { stroke: #768390; }
    .depth { stroke: #f0883e; }
    .bracket { stroke: #9198a1; }
  }
</style>
<text x="40" y="28" class="title">Quick dip: a page turn</text>
<line x1="40.0" y1="250.0" x2="340.0" y2="250.0" class="axis"/>
<line x1="40.0" y1="250.0" x2="40.0" y2="60.0" class="axis"/>
<text x="34.0" y="206.5" class="tick" text-anchor="end">80°</text>
<text x="34.0" y="159.0" class="tick" text-anchor="end">100°</text>
<text x="34.0" y="111.5" class="tick" text-anchor="end">120°</text>
<text x="34.0" y="64.0" class="tick" text-anchor="end">140°</text>
<text x="40.0" y="266.0" class="tick" text-anchor="middle">0 s</text>
<text x="160.0" y="266.0" class="tick" text-anchor="middle">1 s</text>
<text x="280.0" y="266.0" class="tick" text-anchor="middle">2 s</text>
<polyline points="40.0,107.5 340.0,107.5" class="rest"/>
<polyline points="40.0,166.9 340.0,166.9" class="depth"/>
<polyline points="40.0,107.5 112.0,107.5 121.6,131.2 131.2,166.9 140.8,183.5 150.4,155.0 160.0,119.4 169.6,109.9 340.0,109.9" class="angle"/>
<circle cx="160.0" cy="119.4" r="6" class="hit"/>
<text x="172.0" y="141.4" class="label strong">pageTurn</text>
<text x="40" y="288" class="label">Dropped 32° below rest and came back within 10°, in 0.3 s.</text>
<text x="190.0" y="99.5" class="label">resting angle</text>
<text x="190.0" y="182.9" class="label">rest − 25° (page-turn depth)</text>
<line x1="121.6" y1="221.5" x2="160.0" y2="221.5" class="bracket"/>
<line x1="121.6" y1="216.8" x2="121.6" y2="226.2" class="bracket"/>
<line x1="160.0" y1="216.8" x2="160.0" y2="226.2" class="bracket"/>
<text x="140.8" y="237.5" class="label" text-anchor="middle">under 1 s</text>
<text x="430" y="28" class="title">Slow fold: no event</text>
<line x1="430.0" y1="250.0" x2="730.0" y2="250.0" class="axis"/>
<line x1="430.0" y1="250.0" x2="430.0" y2="60.0" class="axis"/>
<text x="424.0" y="206.5" class="tick" text-anchor="end">80°</text>
<text x="424.0" y="159.0" class="tick" text-anchor="end">100°</text>
<text x="424.0" y="111.5" class="tick" text-anchor="end">120°</text>
<text x="424.0" y="64.0" class="tick" text-anchor="end">140°</text>
<text x="430.0" y="266.0" class="tick" text-anchor="middle">0 s</text>
<text x="550.0" y="266.0" class="tick" text-anchor="middle">1 s</text>
<text x="670.0" y="266.0" class="tick" text-anchor="middle">2 s</text>
<polyline points="430.0,107.5 466.0,107.5 526.0,107.5 586.0,107.5 587.2,145.5 646.0,145.5 647.2,164.5 694.0,164.5 695.2,178.8 730.0,178.8" class="rest"/>
<polyline points="430.0,166.9 466.0,166.9 526.0,166.9 586.0,166.9 587.2,204.9 646.0,204.9 647.2,223.9 694.0,223.9 695.2,238.1 730.0,238.1" class="depth"/>
<polyline points="430.0,107.5 466.0,107.5 526.0,126.5 586.0,145.5 646.0,164.5 694.0,178.8 730.0,178.8" class="angle"/>
<text x="430" y="288" class="label">Took longer than 1 s, so the resting angle moves instead.</text>
</svg>
