name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: Tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Test
        run: swift test
  ios:
    name: Build (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: xcodebuild build -scheme HingeKit -destination 'generic/platform=iOS Simulator' -quiet
